name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docker-build.yaml
      - backend/**/*
      - frontend/**/*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        service: [frontend, backend]
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: ${{ matrix.service }}
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: ${{ matrix.service }}
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/whyredfire/ss-${{ matrix.service }}
      meta-tags: |
        type=sha,format=long,prefix=
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Images with critical vulnerabilities are pushed but never deployed
  scan:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "latest"
          image-ref: "ghcr.io/whyredfire/ss-${{ matrix.service }}:${{ github.sha }}"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

  update-manifests:
    needs: scan
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Update image tags
        run: |
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/whyredfire/ss-frontend:${GITHUB_SHA}\"" k8s/frontend/deployment.yaml
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/whyredfire/ss-backend:${GITHUB_SHA}\"" k8s/backend/deployment.yaml

      - name: Commit to repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: "k8s: Bump images to ${{ github.sha }} [no ci]"
          file_pattern: "k8s/**/deployment.yaml"
