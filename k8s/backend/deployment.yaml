apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  template:
    spec:
      containers:
        - name: backend
          image: ghcr.io/whyredfire/ss-backend:3d02a365f1f19eabb8d2d7cfc30a54e47c714052
          ports:
            - containerPort: 8000
          env:
            - name: DB_CONNECTION
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_CONNECTION
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: PASS_SALT
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: PASS_SALT
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
